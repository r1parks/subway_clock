<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subway Clock Setup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1>Subway Clock Settings</h1>
        <form method="POST">

            <label for="stops-select">
                <strong>Stops</strong>
            </label>
            <select id="stops-select" name="stop_ids" multiple>
                {% for stop_id, stop_name in all_stops.items() %}
                    <option value="{{ stop_id }}" {% if stop_id in config.get('stop_ids', []) %}selected{% endif %}>
                        {{ stop_name }}
                    </option>
                {% endfor %}
            </select>

            <label for="routes">
                <strong>Routes</strong>
                <input type="text" id="routes" name="routes" value="{{ ', '.join(config.get('routes', [])) }}" placeholder="e.g. A, C, E or *">
                <small>Comma-separated route letters. Use <code>*</code> for all routes.</small>
            </label>

            <div class="grid">
                <label for="day_brightness">
                    <strong>Day Brightness</strong>
                    <input type="number" id="day_brightness" name="day_brightness" value="{{ config.get('day_brightness', 100) }}" min="0" max="100">
                    <small>0–100</small>
                </label>
                <label for="night_brightness">
                    <strong>Night Brightness</strong>
                    <input type="number" id="night_brightness" name="night_brightness" value="{{ config.get('night_brightness', 2) }}" min="0" max="100">
                    <small>0–100</small>
                </label>
            </div>

            <label for="weather_zip">
                <strong>Weather Zip Code</strong>
                <input type="text" id="weather_zip" name="weather_zip" value="{{ config.get('weather_zip', '12508') }}" pattern="[0-9]{5}" title="Please enter a 5-digit US Zip Code" placeholder="10025">
            </label>

            <input type="hidden" name="portal_ssid" value="{{ config.get('portal_ssid', 'SubwayClock') }}">

            <button type="submit" class="contrast">Save Changes</button>
        </form>

        <p><small>The clock will automatically update within 30 seconds of saving.</small></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <script>
        new TomSelect('#stops-select', {
            plugins: ['remove_button'],
            placeholder: 'Search for a station...',
            maxOptions: null,
        });
    </script>
</body>
</html>
